server.port=8081
spring.application.name=scalable-read-apis
spring.datasource.url=jdbc:h2:mem:postsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.cache.type=caffeine
spring.cache.cache-names=posts,postById,authorPosts,postsWithComments,topPosts,analytics
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
logging.level.com.example.scalablereadapis=INFO
